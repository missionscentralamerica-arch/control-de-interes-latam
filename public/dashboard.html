<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121a21" />
  <title>Dashboard</title>
  <link rel="icon" type="image/png" href="/img/starchurch.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="container dashboard-wrapper">
    <section class="card">
      <div class="dashboard-header">
        <div class="card-header dashboard-title">
          <img src="/img/NorthStar+Star-color-removebg-preview.png" alt="North Star" class="brand-mark" />
          <div>
            <h1>Panel de seguimiento</h1>
            <p id="userLabel"></p>
          </div>
        </div>
        <div class="actions">
          <button id="exportBtn" class="secondary-btn">Exportar PDF</button>
          <button id="logoutBtn" class="ghost-btn">Cerrar sesión</button>
        </div>
      </div>

      <div class="share-box dashboard-share-box">
        <div>
          <strong>Link público de registro</strong>
          <p id="shareLink" class="share-link"></p>
        </div>
        <div class="share-actions">
          <button type="button" id="copyLinkBtn" class="secondary-btn">Copiar link</button>
          <a href="/qr.html" class="secondary-btn view-qr-btn" target="_blank" rel="noopener noreferrer">Ver código QR</a>
        </div>
      </div>

      <div class="filters">
        <label>
          Desde
          <input type="date" id="desde" />
        </label>

        <label>
          Hasta
          <input type="date" id="hasta" />
        </label>

        <label>
          Código postal
          <input type="text" id="codigoPostal" inputmode="numeric" placeholder="Ej. 28001" />
        </label>

        <label>
          Reconciliación
          <select id="reconciliacion">
            <option value="">Todos</option>
            <option value="true">Sí</option>
            <option value="false">No</option>
          </select>
        </label>

        <label>
          Aceptar a Cristo
          <select id="aceptarCristo">
            <option value="">Todos</option>
            <option value="true">Sí</option>
            <option value="false">No</option>
          </select>
        </label>

        <label>
          Iglesia
          <input type="text" id="iglesia" placeholder="Ej. Iglesia Central" />
        </label>

        <label>
          Voluntario
          <input type="text" id="voluntario" placeholder="Ej. Equipo de apoyo" />
        </label>

        <label>
          Estado
          <select id="estado">
            <option value="">Todos</option>
          </select>
        </label>

        <button id="applyFiltersBtn" class="primary-btn">Aplicar filtros</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Teléfono</th>
              <th>Código postal</th>
              <th>Edad</th>
              <th>Evento</th>
              <th>Iglesia</th>
              <th>Voluntario</th>
              <th>Reconciliación</th>
              <th>Aceptar a Cristo</th>
              <th>Estado</th>
              <th>Fecha</th>
            </tr>
          </thead>
          <tbody id="personasTableBody"></tbody>
        </table>
      </div>
      <p id="mensaje" class="mensaje" aria-live="polite"></p>
    </section>
  </main>

  <div id="estadoModal" class="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="estadoModalTitle">
      <div class="modal-header">
        <div>
          <p class="modal-kicker">Seguimiento</p>
          <h2 id="estadoModalTitle">Actualizar estado</h2>
        </div>
        <button type="button" id="closeEstadoModalBtn" class="icon-btn" aria-label="Cerrar">×</button>
      </div>

      <form id="estadoForm" class="form-grid">
        <input type="hidden" id="estadoPersonaId" />
        <label class="full-width">
          Estado actual
          <select id="nuevoEstado" required></select>
        </label>
        <label class="full-width">
          Nota (opcional)
          <textarea id="notaEstado" rows="3" maxlength="5000" placeholder="Añade contexto para el próximo seguimiento..."></textarea>
        </label>
        <button type="submit" class="primary-btn full-width">Guardar cambio de estado</button>
      </form>

      <div class="history-section">
        <h3>Historial de estados</h3>
        <div id="estadoHistorial" class="history-list" aria-live="polite"></div>
      </div>
      <p id="estadoMensaje" class="mensaje" aria-live="polite"></p>
    </section>
  </div>

  <script src="/config.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/ui.js"></script>
</body>
</html>
