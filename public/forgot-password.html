<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121a21" />
  <title>Recuperar contraseña</title>
  <link rel="icon" type="image/png" href="/img/starchurch.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="container compact">
    <section class="card">
      <header class="card-header">
        <img src="/img/NorthStar+Star-color-removebg-preview.png" alt="North Star" class="brand-mark" />
        <div>
          <h1>Recuperar contraseña</h1>
          <p class="subtitle">Ingresa tu correo y te enviaremos un enlace de restablecimiento.</p>
        </div>
      </header>

      <form id="forgotForm" class="form-grid">
        <label class="full-width">
          Correo electrónico
          <input type="email" name="email" required autocomplete="email" inputmode="email" placeholder="nombre@correo.com" />
        </label>

        <button type="submit" class="primary-btn full-width">Enviar enlace</button>
      </form>

      <p id="mensaje" class="mensaje" aria-live="polite"></p>
      <p class="text-link-row">
        <a href="/login.html">Volver al login</a>
      </p>
    </section>
  </main>

  <script src="/js/forgot-password.js"></script>
  <script src="/js/ui.js"></script>
</body>
</html>
